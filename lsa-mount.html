<!--
  Long Service Award — Milestone Overlay
  Mount snippet for a Liferay Web Content fragment.
  ---------------------------------------------------------------------------
  WHAT TO DO
  1. Host lsa-experience.css, lsa-experience.js and the assets/ folder.
  2. Replace the two REPLACE_WITH_ASSET_PATH placeholders below with where
     the CSS and JS are hosted.
  3. In lsa-experience.js, set ASSET_PATH (near the top) to where assets/ is
     hosted. It is relative to the PAGE, not to the script.
  4. Output this snippet only for a user who should see the overlay, with
     their name and milestone filled in (see the mount element below). The
     overlay plays every time this snippet is on the page; "show only once"
     has to be decided on the server.

  THE FIVE IMAGES in assets/ are loaded by the script, not by tags here:
  medal.svg, Stack.png, diamond.png, card-back.jpg and gal4.jpg.

  CONTENT SECURITY POLICY. The page must allow:
    style-src    https://fonts.googleapis.com   (fonts, see below)
    font-src     https://fonts.gstatic.com
    connect-src  wherever assets/ is hosted      (medal.svg is loaded with
                                                  fetch(); if blocked, the
                                                  medal face is blank)
  Nothing inline is used, so no 'unsafe-inline' is needed.

  LOAD ORDER. Fonts, then the stylesheet, then the script. The script is
  deferred, so it runs after the page is parsed. Desktop only: below 1024px
  wide it does nothing.
-->

<!--
  Aleo (the counter and the medal's number) and Public Sans 600 (the card's
  sentence), from Google Fonts in one request. If the CSP blocks Google Fonts,
  nothing breaks: the text falls back to the system font. To avoid that,
  self-host the two fonts with @font-face instead and delete these three tags.
  Only weight 600 of Public Sans is loaded.
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Aleo:ital,wght@0,700;1,700&family=Public+Sans:wght@600&display=swap">

<link rel="stylesheet" href="REPLACE_WITH_ASSET_PATH/lsa-experience.css">

<!--
  THE MOUNT ELEMENT. Fill these in per user on the server:
    data-name   the employee's name, shown in the card's sentence
    data-years  their milestone, e.g. 5, 10 ... 50. It sets the counter, the
                number on the medal, the number of diamonds (one per 5 years),
                and the sentence. The hold lasts 4s at 5 years up to 10s at 50.
                Any positive whole number works.
  If either is missing, the script uses "Akhil" and 5.
-->
<div id="lsa-mount" data-name="Akhil" data-years="5"></div>

<script src="REPLACE_WITH_ASSET_PATH/lsa-experience.js" defer></script>
