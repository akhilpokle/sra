<!--
  Long Service Award — 5 Year Milestone Overlay
  Mount snippet for a Liferay Web Content fragment.
  ---------------------------------------------------------------------------
  Paste this whole block into the fragment. It carries the mount point plus
  the asset tags, loaded here rather than via the theme (project decision).

  Replace the three REPLACE_WITH_ASSET_PATH placeholders below with the actual
  hosted URLs for lsa-experience.css / fireworks-engine-2.js / lsa-experience.js
  (e.g. Documents & Media URLs, or a static resource path) once that's decided
  — see handoff.md.

  THREE assets, not two: the fireworks engine is its own file, shared with the
  tuning lab so there is only ever one copy of it. All three have to be hosted.

  The engine is fireworks-engine-2.js, NOT fireworks-engine.js. Both exist in
  the repo; the overlay runs the second. Hosting the wrong one leaves the page
  with a script that defines a global nothing calls, and an overlay that throws
  on load.

  THREE FILES ARE TAGGED HERE, BUT THREE IMAGES ALSO HAVE TO BE HOSTED —
  assets/medal-face-blank.png and assets/medal-edge.svg for the medallion, and
  assets/gal4.jpg for the galaxy the counter ignites through. They are not
  tagged below because nothing loads them from markup: all three are img.src,
  built in lsa-experience.js against its ASSET_PATH constant, which resolves
  against THE PAGE. Set that constant to match wherever the folder ends up.

  ONE PATH RULE, not two, since 2026-09-07. shimmer.png used to be a
  mask-image url() in lsa-experience.css, which resolves against THE STYLESHEET
  and so forced the CSS file and assets/ to stay siblings. The shimmer was
  removed; that constraint went with it, and so did the file.

  Serve .svg as image/svg+xml. Served as application/octet-stream an SVG in an
  <img> renders as nothing, which silently blanks all 34 of the medallion's
  edge layers and leaves the face floating with no rim.

  Load order matters twice over: the stylesheet must load before the script
  runs, so the overlay never renders unstyled for a frame; and the engine must
  load before lsa-experience.js, which calls into it. Both scripts are
  deferred, and deferred scripts run in document order, so the order they are
  written here is the order they execute — do not reorder them.
-->

<!--
  Aleo, the count-up's typeface. THE ONE CDN IN THIS PROJECT, and the one thing
  here that is not self-hosted — everything else is served from your own paths.

  Two things to check with whoever owns the page's Content Security Policy:
  fonts.googleapis.com must be allowed as a style-src, and fonts.gstatic.com as
  a font-src. If either is refused, delete these three tags and self-host the
  woff2 in assets/ with an @font-face instead — the overlay does not break
  without them, the counter just falls back to the system sans (see .lsa-count
  in lsa-experience.css).

  It goes before the stylesheet so the @font-face is known by the time
  .lsa-count is styled.
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Aleo:ital,wght@0,700;1,700&display=swap">

<link rel="stylesheet" href="REPLACE_WITH_ASSET_PATH/lsa-experience.css">

<!--
  data-name and data-years personalise the overlay, and Liferay should render
  both server-side per user. They are optional: leave either off and the script
  falls back to the constants at the top of lsa-experience.js.

  data-years is not just the sentence on the card any more. It is the number
  the charge button counts up to while the user holds their spark on it, so it
  is on screen for three seconds before the card is ever revealed. A five-year
  award counts to 5; a fifty-year award counts to 50 in the same three seconds.

  Any positive whole number works. It is not restricted to multiples of five.
-->
<div id="lsa-mount" data-name="Akhil" data-years="5"></div>

<script src="REPLACE_WITH_ASSET_PATH/fireworks-engine-2.js" defer></script>
<script src="REPLACE_WITH_ASSET_PATH/lsa-experience.js" defer></script>
