<!DOCTYPE html>
<!--
  Long Service Award — local demo stage.
  ---------------------------------------------------------------------------
  Loads the REAL overlay (lsa-experience.css + lsa-experience.js) over a
  stand-in page background, so what you see here is what the Liferay fragment
  will do. Nothing is duplicated: if it renders here, it is the shipped code
  rendering it.

  data-lsa-dev on <html> is what opts this page into the experience's dev hook
  (window.__lsaDev — cfg, burst, launch, stats, step). lsa-mount.html, the
  actual Liferay markup, does NOT set it, so the hook never exists in
  production and no global is ever created there.

  The inline <style> below is demo-only page dressing. The project's
  no-inline-code rule applies to the Liferay fragment, which shares a page
  with a Content Security Policy — it does not apply to this local harness.

  Serve it over HTTP rather than opening the file directly; some browsers
  refuse to load sibling assets over file://. From the project root:
      npx serve .        (or any static server)
-->
<html lang="en" data-lsa-dev>
<head>
  <meta charset="utf-8">
  <title>LSA Overlay — Local Demo Stage</title>

  <style>
    html, body { margin: 0; padding: 0; height: 100%; }

    /* Stands in for the Liferay intranet page the overlay sits on top of. */
    body {
      background-image: url("bg.png");
      background-size: cover;
      background-position: top center;
      background-repeat: no-repeat;
      background-attachment: fixed;
      background-color: #1b2733;
    }
  </style>

  <link rel="stylesheet" href="lsa-experience.css">
</head>
<body>

  <!--
    No mount markup needed: lsa-experience.js builds its own .lsa-root and
    appends it to <body>. Press GO for the five-firework sequence, or click
    anywhere on the stage to send up a single rocket.
  -->
  <script src="lsa-experience.js"></script>

</body>
</html>
