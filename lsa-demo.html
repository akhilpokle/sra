<!DOCTYPE html>
<!--
  Long Service Award — local demo page. Not part of what ships.
  ---------------------------------------------------------------------------
  Loads the real overlay (lsa-experience.css and lsa-experience.js) over a
  screenshot of the intranet (bg.png), so what you see is what Liferay gets.

  Serve it over HTTP, not file://. From the project folder:
      node .claude/serve.js . 8126
  then open http://localhost:8126/lsa-demo.html. The window must be at least
  1024px wide.

  To try another milestone or name, add it to the address:
      lsa-demo.html?years=50
      lsa-demo.html?years=25&name=Priya
  or change data-years or data-name on the mount element below.

  The inline <style> is demo dressing only; the CSP rules apply to Liferay,
  not to this page.
-->
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>LSA Overlay — Local Demo Stage</title>

  <style>
    html, body { margin: 0; padding: 0; height: 100%; }

    /* Stands in for the Liferay intranet page the overlay sits on top of. */
    body {
      background-image: url("bg.png");
      background-size: cover;
      background-position: top center;
      background-repeat: no-repeat;
      background-attachment: fixed;
      background-color: #1b2733;
    }
  </style>

  <!-- Same fonts, same order as lsa-mount.html. -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Aleo:ital,wght@0,700;1,700&family=Public+Sans:wght@600&display=swap">

  <link rel="stylesheet" href="lsa-experience.css">
</head>
<body>

  <div id="lsa-mount" data-name="Akhil" data-years="5"></div>

  <!-- Demo only: ?years=50 and ?name=Priya in the address override the mount
       element, so any milestone can be shown by URL. On Liferay the server
       fills these in instead. -->
  <script>
    (function () {
      var q = new URLSearchParams(location.search);
      var mount = document.getElementById('lsa-mount');
      var years = parseInt(q.get('years'), 10);
      if (years > 0) mount.setAttribute('data-years', String(years));
      if (q.has('name')) mount.setAttribute('data-name', q.get('name'));
    })();
  </script>

  <script src="lsa-experience.js"></script>

</body>
</html>
