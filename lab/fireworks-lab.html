<!DOCTYPE html>
<!-- Fireworks lab — experimentation only, not part of the Liferay deliverable. -->
<html lang="en">
<head>
<meta charset="utf-8">
<title>Fireworks Lab</title>
<style>
  html, body {
    margin: 0;
    height: 100%;
    background: #fff;
    font: 13px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
    color: #1a1a1a;
  }

  .lab {
    display: grid;
    grid-template-columns: 1fr 400px;
    height: 100%;
  }

  .lab-stage {
    position: relative;
    min-width: 0; /* let the canvas shrink instead of forcing the grid wider */
  }

  .lab-canvas {
    display: block;
    width: 100%;
    height: 100%;
    background: #0b1a30; /* night sky — also painted per frame, see draw() */
    cursor: crosshair;
  }

  .lab-actions {
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .lab-actions button {
    font: inherit;
    font-size: 12px;
    padding: 5px 12px;
    border: 1px solid #d5d5d5;
    border-radius: 4px;
    background: #fff;
    cursor: pointer;
  }

  .lab-actions button:hover { border-color: #999; }

  .lab-actions button.primary {
    background: #1a1a1a;
    border-color: #1a1a1a;
    color: #fff;
  }

  .lab-actions label {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    font-size: 12px;
    color: #666;
  }

  .lab-import {
    display: block;
    width: 100%;
    margin-top: 8px;
    box-sizing: border-box;
    resize: vertical;
    font: 11px/1.5 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    color: #444;
    padding: 5px 7px;
    border: 1px solid #d5d5d5;
    border-radius: 4px;
    background: #fafafa;
  }

  .lab-stats {
    font: 11px/1.6 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    color: #666;
    background: #fafafa;
  }

  .lab-stats b {
    color: #1a1a1a;
    font-weight: 600;
  }

  .lab-panel {
    border-left: 1px solid #e2e2e2;
    overflow-y: auto;
    padding: 0 0 32px;
  }

  /* ---- Panel ------------------------------------------------------------ */

  .lab-section {
    border-bottom: 1px solid #ededed;
    padding: 14px 16px 16px;
  }

  .lab-section > h2 {
    margin: 0 0 2px;
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: #1a1a1a;
  }

  .lab-section > p {
    margin: 0 0 12px;
    font-size: 11px;
    color: #8a8a8a;
  }

  .lab-sub {
    margin: 14px 0 8px;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: #8a8a8a;
  }

  .lab-field {
    display: grid;
    grid-template-columns: 1fr 92px 44px;
    align-items: center;
    gap: 8px;
    margin-bottom: 7px;
  }

  .lab-field > label {
    font-size: 12px;
    color: #444;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .lab-field > .lab-val {
    font: 11px/1 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    color: #666;
    text-align: right;
  }

  .lab-field input[type="range"] {
    width: 100%;
    margin: 0;
  }

  .lab-field select {
    grid-column: 2 / span 2;
    width: 100%;
    font: inherit;
    font-size: 12px;
    padding: 2px 4px;
    border: 1px solid #d5d5d5;
    border-radius: 3px;
    background: #fff;
  }

  .lab-field input[type="checkbox"] {
    grid-column: 2;
    justify-self: start;
    margin: 0;
  }
</style>
</head>
<body>

<div class="lab">
  <div class="lab-stage">
    <canvas class="lab-canvas" id="stage"></canvas>
  </div>
  <div class="lab-panel" id="panel">
    <div class="lab-section lab-actions">
      <button class="primary" id="act-burst">Burst</button>
      <button id="act-clear">Clear</button>
      <button id="act-reset">Reset</button>
      <label><input type="checkbox" id="act-auto"> auto</label>
    </div>
    <div class="lab-section">
      <div class="lab-actions">
        <button id="act-copy">Copy config</button>
        <button id="act-paste">Apply pasted</button>
      </div>
      <textarea class="lab-import" id="act-import" rows="2" spellcheck="false"
                placeholder="paste a config here, then Apply pasted"></textarea>
    </div>
    <div class="lab-section lab-stats" id="stats"></div>
  </div>
</div>

<!-- The engine is a separate file so the projects that use it and this lab
     run the same code. Tune here, copy the config out, paste it there — the
     engine itself is never duplicated. Classic script, not a module, so the
     lab still works opened straight off disk. -->
<script src="../fireworks-engine.js"></script>

<script>
(function () {
  'use strict';

  /* ======================================================================
     Control schema.

     Two independent parameter sets, kept separate on purpose: Hanabi's are
     PER-FRAME values tuned for a 30fps throttle, confetti.js's are PER-SECOND
     values integrated against delta time. Mixing them silently is what makes
     borrowed constants behave unexpectedly, so the panel keeps the two models
     visibly apart and labels the units.

     Defaults are the real defaults from each library.
     ====================================================================== */

  var SCHEMA = [
    {
      title: 'Size',
      note: 'overall scale · multiplies burst spread and shard size together',
      fields: [
        { path: 'scale', label: 'Firework size', min: 0.3, max: 5, step: 0.05, value: 1 }
      ]
    },
    {
      title: 'Shape',
      note: 'what the sparkles are arranged into at the moment of the break',
      fields: [
        { path: 'shape.type', label: 'Shape', type: 'select', value: 'normal',
          options: ['normal', 'star burst', 'concentric', 'squiggle', 'dbs sparks'] },

        { sub: 'Star burst' },
        { path: 'shape.starPoints', label: 'Points', min: 3, max: 12, step: 1, value: 5 },
        { path: 'shape.starInner', label: 'Valley radius', min: 0.05, max: 0.9, step: 0.05, value: 0.3 },

        { sub: 'Concentric' },
        { path: 'shape.rings', label: 'Rings', min: 2, max: 6, step: 1, value: 3 },
        { path: 'shape.ringWidth', label: 'Ring width', min: 0, max: 0.3, step: 0.01, value: 0.04 },

        { sub: 'Squiggle' },
        // Half-swing width in px is waveAmp / (2 * waveFreq) — 500 / 6 = ~83px.
        { path: 'shape.waveAmp', label: 'Weave speed px/s', min: 0, max: 1500, step: 25, value: 500 },
        { path: 'shape.waveFreq', label: 'Zig-zags / s', min: 0.5, max: 12, step: 0.5, value: 3 },

        { sub: 'DBS sparks' },
        { path: 'shape.hexRays', label: 'Corner rays', min: 0, max: 1, step: 0.05, value: 0.55 },
        { path: 'shape.hexJitter', label: 'Edge jitter', min: 0, max: 0.3, step: 0.01, value: 0.06 }
      ]
    },
    {
      title: 'Sub-blasts',
      note: 'shells carried out by the burst that break again a moment later',
      fields: [
        { path: 'sub.enabled', label: 'Enabled', type: 'check', value: false },
        { path: 'sub.count', label: 'Shells / burst', min: 1, max: 24, step: 1, value: 6 },
        { path: 'sub.delay', label: 'Delay (s)', min: 0.1, max: 2.5, step: 0.05, value: 0.7 },
        { path: 'sub.particles', label: 'Particles / shell', min: 5, max: 120, step: 5, value: 30 },
        { path: 'sub.scale', label: 'Size x', min: 0.05, max: 1, step: 0.05, value: 0.3 },
        { path: 'sub.glow', label: 'Flash', type: 'check', value: true }
      ]
    },
    {
      title: 'Hanabi',
      note: 'per-frame values · reference runs at 30fps',
      fields: [
        { path: 'hanabi.layer', label: 'View layer', type: 'select', value: 'composite',
          options: ['composite', 'particles', 'trail', 'glow', 'smoke'] },
        { path: 'hanabi.palette', label: 'Palette', type: 'select', value: 'fire',
          options: ['fire', 'blue', 'purple', 'random'] },
        { path: 'hanabi.fps', label: 'Target fps', min: 1, max: 60, step: 1, value: 30 },

        { sub: 'Burst' },
        { path: 'hanabi.count', label: 'Particles / burst', min: 10, max: 500, step: 10, value: 200 },
        { path: 'hanabi.explosionSize', label: 'Explosion size', min: 1, max: 40, step: 0.5, value: 10 },
        { path: 'hanabi.poolMax', label: 'Pool max', min: 200, max: 4000, step: 100, value: 2000 },

        { sub: 'Physics' },
        { path: 'hanabi.gravity', label: 'Gravity', min: 0, max: 1, step: 0.01, value: 0.2 },
        { path: 'hanabi.drag', label: 'Drag', min: 0.8, max: 1, step: 0.005, value: 0.9 },
        { path: 'hanabi.lifeDecay', label: 'Life decay', min: 0.002, max: 0.05, step: 0.001, value: 0.01 },

        { sub: 'Trail & glow' },
        { path: 'hanabi.trailFade', label: 'Trail fade', min: 0.01, max: 0.3, step: 0.005, value: 0.05 },
        { path: 'hanabi.trailAlpha', label: 'Trail alpha', min: 0, max: 1, step: 0.05, value: 0.6 },
        { path: 'hanabi.glowDownscale', label: 'Glow downscale', min: 1, max: 8, step: 1, value: 4 },

        { sub: 'Colour jitter' },
        { path: 'hanabi.jitterHue', label: 'Hue ±°', min: 0, max: 30, step: 1, value: 5 },
        { path: 'hanabi.jitterSat', label: 'Saturation ±', min: 0, max: 30, step: 1, value: 10 },
        { path: 'hanabi.jitterLight', label: 'Lightness ±', min: 0, max: 30, step: 1, value: 10 },

        { sub: 'Smoke' },
        { path: 'hanabi.smoke.enabled', label: 'Enabled', type: 'check', value: true },
        { path: 'hanabi.smoke.countMin', label: 'Count min', min: 0, max: 40, step: 1, value: 12 },
        { path: 'hanabi.smoke.countMax', label: 'Count max', min: 0, max: 40, step: 1, value: 20 },
        { path: 'hanabi.smoke.sizeMin', label: 'Size min', min: 1, max: 20, step: 0.5, value: 3 },
        { path: 'hanabi.smoke.sizeMax', label: 'Size max', min: 1, max: 20, step: 0.5, value: 8 },
        { path: 'hanabi.smoke.rise', label: 'Rise', min: 0, max: 0.05, step: 0.001, value: 0.015 },
        { path: 'hanabi.smoke.dragX', label: 'Drag X', min: 0.8, max: 1, step: 0.005, value: 0.95 },
        { path: 'hanabi.smoke.dragY', label: 'Drag Y', min: 0.8, max: 1, step: 0.005, value: 0.92 },
        { path: 'hanabi.smoke.growth', label: 'Growth', min: 0, max: 0.3, step: 0.01, value: 0.08 },
        { path: 'hanabi.smoke.lifeDecay', label: 'Life decay', min: 0.002, max: 0.05, step: 0.001, value: 0.012 },
        { path: 'hanabi.smoke.maxAlpha', label: 'Max alpha', min: 0, max: 1, step: 0.05, value: 0.25 }
      ]
    },
    {
      title: 'confetti.js',
      note: 'per-second values · what Hanabi has no equivalent for',
      fields: [
        // Only what confetti actually contributes to the mix. Its count,
        // velocity, drag and gravity all duplicated a Hanabi control that
        // already drives the engine, so they were removed rather than left
        // sitting in the panel doing nothing.
        { path: 'confetti.size', label: 'Shard size', min: 0.2, max: 5, step: 0.1, value: 1 },
        { path: 'confetti.spin', label: 'Spin ±°/s', min: 0, max: 720, step: 10, value: 250 },

        { sub: 'Physics' },
        { path: 'confetti.massSpread', label: 'Mass spread', min: 0, max: 1, step: 0.01, value: 0.33 },
        { path: 'confetti.flutter', label: 'Flutter ±', min: 0, max: 1000, step: 10, value: 350 },
        { path: 'confetti.deltaCap', label: 'Delta cap (s)', min: 0.016, max: 0.2, step: 0.004, value: 0.064 },

        { sub: 'Lifetime spread' },
        { path: 'confetti.fadeMin', label: 'Life ×min', min: 0.1, max: 5, step: 0.1, value: 0.5 },
        { path: 'confetti.fadeMax', label: 'Life ×max', min: 0.1, max: 5, step: 0.1, value: 2.5 }
      ]
    },
    {
      title: 'Blast glow',
      note: 'the shell detonating · neither library has this',
      fields: [
        { path: 'blast.enabled', label: 'Enabled', type: 'check', value: true },
        { path: 'blast.lead', label: 'Lead (ms)', min: 0, max: 300, step: 10, value: 60 },
        { path: 'blast.radius', label: 'Radius', min: 20, max: 400, step: 10, value: 140 },
        { path: 'blast.peak', label: 'Peak alpha', min: 0, max: 1, step: 0.05, value: 0.55 },
        { path: 'blast.rise', label: 'Rise (s)', min: 0.01, max: 0.5, step: 0.01, value: 0.06 },
        { path: 'blast.hold', label: 'Hold (s)', min: 0, max: 2, step: 0.05, value: 0.15 },
        { path: 'blast.decay', label: 'Decay (s)', min: 0.05, max: 6, step: 0.05, value: 1.8 }
      ]
    },
    {
      title: 'Centre glow',
      note: 'the white core at the middle of the break · lights instantly, grows as it dies',
      fields: [
        { path: 'core.enabled', label: 'Enabled', type: 'check', value: true },
        { path: 'core.radius', label: 'Radius', min: 2, max: 120, step: 1, value: 22 },
        { path: 'core.life', label: 'Life (s)', min: 0.05, max: 2, step: 0.05, value: 0.45 },
        { path: 'core.peak', label: 'Peak alpha', min: 0, max: 1, step: 0.05, value: 1 },
        { path: 'core.growth', label: 'Growth x', min: 1, max: 5, step: 0.1, value: 2.2 },
        { path: 'core.falloff', label: 'Falloff', min: 0.5, max: 5, step: 0.1, value: 2 },
        // How much of the disc stays at full alpha before the rim fades. Low
        // values are a soft smudge that vanishes into the blast; high values
        // are a hard-edged ball.
        { path: 'core.edge', label: 'Hard edge', min: 0, max: 0.95, step: 0.05, value: 0.62 }
      ]
    }
  ];

  /* ---- Config -----------------------------------------------------------
     Built from the schema so the two cannot drift apart. Read this live
     (per frame / per spawn) rather than caching values into locals — that is
     what lets a slider change the show while it is running. */

  var cfg = {};

  function setPath(obj, path, val) {
    var keys = path.split('.');
    var last = keys.pop();
    var node = keys.reduce(function (acc, k) {
      acc[k] = acc[k] || {};
      return acc[k];
    }, obj);
    node[last] = val;
  }

  /* ---- Render ----------------------------------------------------------- */

  var panel = document.getElementById('panel');
  var controls = []; // every rendered control, so Reset can restore all of them

  function field(f) {
    setPath(cfg, f.path, f.value);

    var row = document.createElement('div');
    row.className = 'lab-field';

    var label = document.createElement('label');
    label.textContent = f.label;
    row.appendChild(label);

    var input, readout;

    if (f.type === 'select') {
      input = document.createElement('select');
      f.options.forEach(function (o) {
        var opt = document.createElement('option');
        opt.value = o;
        opt.textContent = o;
        input.appendChild(opt);
      });
      input.value = f.value;
      input.addEventListener('change', function () { setPath(cfg, f.path, input.value); });

    } else if (f.type === 'check') {
      input = document.createElement('input');
      input.type = 'checkbox';
      input.checked = f.value;
      input.addEventListener('change', function () { setPath(cfg, f.path, input.checked); });

    } else {
      input = document.createElement('input');
      input.type = 'range';
      input.min = f.min;
      input.max = f.max;
      input.step = f.step;
      input.value = f.value;

      readout = document.createElement('span');
      readout.className = 'lab-val';
      readout.textContent = f.value;

      input.addEventListener('input', function () {
        var v = parseFloat(input.value);
        setPath(cfg, f.path, v);
        readout.textContent = v;
      });
    }

    label.htmlFor = input.id = 'f-' + f.path.replace(/\./g, '-');
    row.appendChild(input);
    if (readout) row.appendChild(readout);
    controls.push({ f: f, input: input, readout: readout });
    return row;
  }

  // f.value is never mutated — cfg is — so the schema stays the defaults.
  function resetAll() {
    controls.forEach(function (c) {
      setPath(cfg, c.f.path, c.f.value);
      if (c.f.type === 'check') c.input.checked = c.f.value;
      else c.input.value = c.f.value;
      if (c.readout) c.readout.textContent = c.f.value;
    });
  }

  SCHEMA.forEach(function (section) {
    var el = document.createElement('div');
    el.className = 'lab-section';

    var h = document.createElement('h2');
    h.textContent = section.title;
    el.appendChild(h);

    var note = document.createElement('p');
    note.textContent = section.note;
    el.appendChild(note);

    section.fields.forEach(function (f) {
      if (f.sub) {
        var sub = document.createElement('div');
        sub.className = 'lab-sub';
        sub.textContent = f.sub;
        el.appendChild(sub);
      } else {
        el.appendChild(field(f));
      }
    });

    panel.appendChild(el);
  });

  /* ---- Stage ------------------------------------------------------------
     Everything the fireworks themselves do lives in fireworks-engine.js. The
     lab owns only the harness around it: what fires a burst, what the readout
     says, and how a tuned config gets back out.

     `cfg` is handed over as built. The engine fills in any key the SCHEMA does
     not cover and then reads the object live, so a slider still changes the
     show while it is running. */

  var fw = Fireworks(document.getElementById('stage'), cfg);

  fw.canvas.addEventListener('click', function (e) {
    var r = fw.canvas.getBoundingClientRect();
    fw.burst(e.clientX - r.left, e.clientY - r.top);
  });

  /* ---- Panel actions ---------------------------------------------------- */

  document.getElementById('act-burst').addEventListener('click', function () {
    var s = fw.size();
    fw.burst(s.w / 2, s.h / 2);
  });

  document.getElementById('act-clear').addEventListener('click', fw.clear);

  document.getElementById('act-reset').addEventListener('click', function () {
    resetAll();
    fw.clear();
  });

  // Auto-fire, matching the reference demo: every 500ms, anywhere across the
  // width, in the middle 60% vertically. Useful for judging density and
  // overlap without having to keep clicking.
  var autoTimer = null;
  document.getElementById('act-auto').addEventListener('change', function () {
    if (autoTimer) { clearInterval(autoTimer); autoTimer = null; }
    if (this.checked) {
      autoTimer = setInterval(function () {
        var s = fw.size();
        fw.burst(Math.random() * s.w, s.h * 0.2 + Math.random() * s.h * 0.6);
      }, 500);
    }
  });

  /* ---- Config in and out -------------------------------------------------
     Slider state is otherwise lost the moment the tab closes, and the only
     route between the lab and a project was reading a number off the panel and
     retyping it. Both directions now go through the clipboard.

     What travels is the config alone, never the engine — the engine is one
     shared file that every project already loads, so values are the only thing
     a tuning session has to carry. The serialiser, the parser and the clipboard
     handling all live in the engine, so this file and the overlay's dev panel
     run the same ones.

     OUT · `Copy config` puts the whole live cfg on the clipboard.
     IN  · paste into the box and press Apply. Anything the panel has a control
           for is applied to both the slider and cfg; anything else is ignored.
           That last part is deliberate rather than lazy — an overlay's config
           carries `background: null` for its transparent composite, and
           applying that here would leave the stage with no night sky to draw
           on. The panel having no control for it is exactly the right filter. */

  var copyBtn = document.getElementById('act-copy');
  var pasteBtn = document.getElementById('act-paste');
  var importBox = document.getElementById('act-import');

  function flash(btn, msg, restore) {
    btn.textContent = msg;
    setTimeout(function () { btn.textContent = restore; }, 1600);
  }

  function exportConfig() {
    return Fireworks.exportConfig(cfg, 'lab');
  }

  copyBtn.addEventListener('click', function () {
    Fireworks.copyText(exportConfig(), function (ok) {
      flash(copyBtn, ok ? 'Copied' : 'Copy failed — see console', 'Copy config');
    });
  });

  function getPath(obj, path) {
    return path.split('.').reduce(function (node, k) {
      return (node == null) ? undefined : node[k];
    }, obj);
  }

  pasteBtn.addEventListener('click', function () {
    var incoming;
    try {
      incoming = Fireworks.parseConfig(importBox.value);
    } catch (err) {
      flash(pasteBtn, 'Could not read that', 'Apply pasted');
      console.error('Config paste failed:', err);
      return;
    }

    var applied = 0;
    controls.forEach(function (c) {
      var v = getPath(incoming, c.f.path);
      if (v === undefined) return; // no such key, or the panel does not own it
      setPath(cfg, c.f.path, v);
      if (c.f.type === 'check') c.input.checked = !!v;
      else c.input.value = v;
      if (c.readout) c.readout.textContent = v;
      applied++;
    });

    // The trail is persistent, so whatever the old settings drew would hang
    // around underneath the new ones.
    fw.clear();
    flash(pasteBtn, applied + ' applied', 'Apply pasted');
  });

  /* ---- Loop -------------------------------------------------------------
     The lab drives the clock. The engine deliberately does not start a loop of
     its own, so the stage keeps control of when it runs. */

  var statsEl = document.getElementById('stats');
  var last = performance.now();
  var frames = 0;
  var fps = 0;
  var sampled = last;

  function tick(now) {
    // Capped so a stalled tab resumes instead of teleporting every particle.
    var dt = Math.min((now - last) / 1000, cfg.confetti.deltaCap);
    last = now;

    fw.update(dt);
    fw.draw(dt);

    frames++;
    if (now - sampled >= 500) {
      fps = Math.round(frames * 1000 / (now - sampled));
      frames = 0;
      sampled = now;
      var s = fw.stats();
      statsEl.innerHTML = '<b>' + fps + '</b> fps &middot; <b>' + s.particles +
                          '</b> live &middot; <b>' + s.pooled + '</b> pooled';
    }
    requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);

  window.lab = {
    fw: fw,
    canvas: fw.canvas, ctx: fw.ctx, cfg: cfg, burst: fw.burst,
    particles: fw.debug.particles, smoke: fw.debug.smoke,
    trail: fw.debug.trailBuf, particleBuf: fw.debug.particleBuf,
    glow: fw.debug.glowBuf, smokeBuf: fw.debug.smokeBuf,
    // Runs the sim synchronously. Needed because requestAnimationFrame does
    // not fire in a non-compositing tab, which is the only way to verify the
    // engine in this environment.
    step: fw.debug.step,
    stats: function () {
      var s = fw.stats();
      return { fps: fps, live: s.particles, pooled: s.pooled };
    },
    // The text the Copy config button puts on the clipboard.
    exportConfig: exportConfig
  };
})();
</script>

</body>
</html>
