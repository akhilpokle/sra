<!DOCTYPE html>
<!--
  Medal lab. A separate playground for the medal interaction.

  Holds only the card, the medal and the medal's cursor tilt, ported from
  lsa-experience.js / lsa-experience.css as of 2026-09-30. No fireworks, no
  charge, no veil. Production does not load anything from here, so change
  freely.

  Class names are kept the same as production (lsa-*) so anything that works
  here can be carried back without renaming.

  Serve over HTTP from the project root, then open /lab/medal-lab/.
-->
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Medal Lab</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Aleo:ital,wght@0,700;1,700&family=Public+Sans:wght@600&display=swap">

  <link rel="stylesheet" href="medal-lab.css">
</head>
<body class="lsa-lab-body">
  <script src="medal-lab.js"></script>
</body>
</html>
